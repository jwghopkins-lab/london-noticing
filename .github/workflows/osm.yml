name: Fetch map data

# The sandbox this repo is authored in cannot reach any OpenStreetMap host: the
# egress proxy refuses overpass, nominatim, the routers and the tile servers
# alike. A runner has ordinary internet. So the fetching happens here and the
# results are committed, which also means the build and the author work from
# the same files, offline, for ever.
#
# Two fetches, both keyed off each tour's own declared bounding box and stop
# list, so a new town anywhere needs no configuration beyond the contract it
# already has:
#
#   streets   the Overpass extract the walk is routed and checked against
#   routes    what independent routing engines make of each leg, which is how
#             confidence.py decides whether a leg can honestly be given as
#             turn-by-turn directions at all
#   elevation the height of the ground under every street, so a walk in a hill
#             town can be checked for climbing the same metres twice

on:
  workflow_dispatch:
    inputs:
      tour:
        description: "Tour id, or 'all'"
        default: "all"
        required: true
      bbox:
        description: "New town only: lat_lo,lat_hi,lon_lo,lon_hi (streets fetch)"
        default: ""
        required: false
      city:
        description: "New town only: the town's name"
        default: ""
        required: false
      what:
        description: "Which fetch to run"
        type: choice
        options: ["both", "streets", "routes", "elevation"]
        default: "both"
        required: true

permissions:
  contents: write

concurrency:
  group: osm

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the street layout from OpenStreetMap
        if: inputs.what == 'both' || inputs.what == 'streets'
        run: |
          if [ -n "${{ inputs.bbox }}" ]; then
            python3 pipeline/fetch_osm.py --tour "${{ inputs.tour }}" \
              --bbox "${{ inputs.bbox }}" --city "${{ inputs.city }}"
          else
            python3 pipeline/fetch_osm.py --tour "${{ inputs.tour }}"
          fi

      # Second opinions on every leg, from engines that are not ours. Where they
      # disagree with us or with each other, the leg is written as a heading and
      # a landmark instead of a sequence of turns.
      - name: Ask other routing engines to walk the same legs
        if: inputs.what == 'both' || inputs.what == 'routes'
        run: python3 pipeline/fetch_routes.py --tour "${{ inputs.tour }}"

      # Height belongs to the map, not to a route, so the stops can be
      # reordered as often as you like without fetching it again.
      - name: Fetch the height of the ground
        if: inputs.what == 'both' || inputs.what == 'elevation'
        run: python3 pipeline/fetch_elevation.py --tour "${{ inputs.tour }}"

      # A fetch can take minutes, and the branch often moves while it runs. The
      # first Cordes fetch worked and then threw the answer away because the
      # push was rejected, which is a silly way to lose two minutes of
      # Overpass's time. Rebase and try again; the data is a new file, so there
      # is nothing for a rebase to conflict with.
      - name: Commit what came back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One directory at a time. Naming all three in one git add fails the
          # whole add when any of them does not exist yet, which on a brand new
          # town means the fetch is silently thrown away and the step reports
          # "map data unchanged". That cost two Overpass fetches to spot.
          for d in data/osm data/routes data/elevation; do
            [ -d "$d" ] && git add "$d"
          done
          if git diff --cached --quiet; then
            echo "map data unchanged"
            exit 0
          fi
          git commit -m "Map data for ${{ inputs.tour }} (${{ inputs.what }})

          Fetched on a runner because the authoring sandbox cannot reach any
          map host. Data from OpenStreetMap, licensed ODbL."
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto the branch as it now stands"
            git pull --rebase origin "${{ github.ref_name }}"
            sleep $((attempt * 3))
          done
          echo "could not push the fetched data after five attempts"
          exit 1
