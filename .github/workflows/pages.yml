name: Build and publish the walks

on:
  push:
    branches: ["claude/tour-directions-poc-ngqx8h", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s pipeline -p 'test_*.py'

      # Every tour under content/ is built and held to the contract in
      # docs/house-style.md, so adding a town needs no edit to this file. The
      # checks that matter are the ones that read the map: a street that does
      # not exist, a heading that disagrees with the street it is attached to,
      # streets named out of order, and a leg written turn-by-turn when the map
      # is too thin to support it.
      - name: Build and check the walks
        run: python3 pipeline/build_tour.py

      # Every listed answer must actually be accepted by the matcher in the
      # shipped page. A published build once rejected the word "two" at a stop
      # whose answer was two, because the normaliser stripped it as filler.
      - name: Check every answer round-trips
        run: node pipeline/check_answers.cjs

      # build_tour.py writes app/<served_at>/index.html per walk, which is what
      # gives each one its own address, and dist/<id>.html as a single file
      # somebody can keep. The archived walks — Gdansk and the London topic
      # picker — are committed builds that are simply carried through, so their
      # links keep working without anything rebuilding them.
      - name: Collect the single file builds
        run: |
          mkdir -p app/download
          cp dist/*.html app/download/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
