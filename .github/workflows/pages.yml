name: Build and publish the walk

on:
  push:
    branches: ["claude/tour-directions-poc-ngqx8h", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The content contracts run before anything is built. A route that fails
      # them should never reach a phone.
      - name: Check the content
        run: python3 pipeline/validate_content.py

      - name: Bake the route artefacts
        run: python3 pipeline/bake.py --include-drafts

      # A generator should not be its own judge, so the artefacts on disk are
      # re-checked by a separate program before they are published.
      - name: Re-check the artefacts independently
        run: python3 pipeline/verify_bakes.py

      - name: Unit tests
        run: python3 -m unittest discover -s pipeline -p 'test_*.py'

      # The fixed walks share the player, so they are built and checked here
      # too. Their contract check covers the things London has no equivalent of:
      # every stop after the first must carry directions that name a turn and
      # give a round distance, every stop must have exactly one kind of gate,
      # and no title may give away its own answer. Every tour under content/
      # is built, so adding one needs no edit to this file.
      - name: Build and check the fixed walks
        run: python3 pipeline/build_tour.py

      # Every listed answer must actually be accepted by the matcher in the
      # shipped page. A published build once rejected the word "two" at a stop
      # whose answer was two, because the normaliser stripped it as filler.
      - name: Check every answer round-trips
        run: node pipeline/check_answers.cjs

      # build_tour.py has already written app/gdansk/index.html,
      # app/gunpowder-mile/index.html and app/noble-val/index.html, which is
      # what gives each walk its own address on the site.
      - name: Publish the single file builds alongside the site
        run: |
          python3 pipeline/build_standalone.py
          mkdir -p app/download
          cp dist/*.html app/download/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
