<title>London Tuesday Quizzes</title>
<meta name="description" content="Pub quizzes in London on Tuesday nights, each one confirmed on the pub's own website.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>

</style>
<style>
:root {
  --bg: #eef1ec;
  --panel: #fbfcfa;
  --ink: #16211b;
  --ink-2: #3e4b43;
  --muted: #66736b;
  --line: #d3dad3;
  --line-2: #e4e9e3;
  --paint: #1d4a39;          /* pub-front green */
  --paint-ink: #f4f7f2;
  --brass: #a8781c;
  --brass-soft: #f3e6c6;
  --focus: #2f6fd0;
  /* map */
  --land: #e9ede6;
  --park: #d3e3cb;
  --water: #b4d0e0;
  --waterline: #8fb6cc;
  --road-major: #ffffff;
  --road-casing: #c9d0c7;
  --road-minor: #fbfcf9;
  --label: #4d5a52;
  --label-halo: #eef1ec;
  /* start-time ramp, early (light) to late (dark): one hue */
  --t0: #7fb9a3; --t1: #5ea68b; --t2: #3f8f73; --t3: #2b775e; --t4: #1f5f4b; --t5: #174a3b; --t6: #10362b;
  --t-ink-light: #0e241c; --t-ink-dark: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --panel: #151d19; --ink: #e5ece7; --ink-2: #c1ccc5; --muted: #8e9b93;
    --line: #2a3530; --line-2: #202a25; --paint: #1b3a2e; --paint-ink: #eaf1ec;
    --brass: #d9a74a; --brass-soft: #3a2f17; --focus: #7aa7ee;
    --land: #18201c; --park: #1d3024; --water: #15303f; --waterline: #1f4458;
    --road-major: #36423b; --road-casing: #1f2823; --road-minor: #2b3530;
    --label: #9aa89f; --label-halo: #18201c;
    --t0: #a8dcc6; --t1: #86cbb0; --t2: #64b797; --t3: #4aa07f; --t4: #378a6a; --t5: #2a7358; --t6: #215e48;
    --t-ink-light: #0e241c; --t-ink-dark: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --panel: #151d19; --ink: #e5ece7; --ink-2: #c1ccc5; --muted: #8e9b93;
  --line: #2a3530; --line-2: #202a25; --paint: #1b3a2e; --paint-ink: #eaf1ec;
  --brass: #d9a74a; --brass-soft: #3a2f17; --focus: #7aa7ee;
  --land: #18201c; --park: #1d3024; --water: #15303f; --waterline: #1f4458;
  --road-major: #36423b; --road-casing: #1f2823; --road-minor: #2b3530;
  --label: #9aa89f; --label-halo: #18201c;
  --t0: #a8dcc6; --t1: #86cbb0; --t2: #64b797; --t3: #4aa07f; --t4: #378a6a; --t5: #2a7358; --t6: #215e48;
  --t-ink-light: #0e241c; --t-ink-dark: #ffffff;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.45;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: minmax(340px, 400px) 1fr;
  grid-template-rows: 100%;
  height: 100%;
}
.side {
  display: flex; flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-right: 1px solid var(--line);
}
.side-scroll { overflow-y: auto; min-height: 0; flex: 1; }
.pad { padding-inline: 20px; }

.masthead {
  background: var(--paint);
  color: var(--paint-ink);
  padding-block: 18px 16px;
}
.masthead h1 {
  font-family: "Young Serif", Georgia, "Times New Roman", serif;
  font-weight: 400;
  font-size: 27px;
  line-height: 1.1;
  margin: 0 0 6px;
  letter-spacing: 0.005em;
  text-wrap: balance;
}
.masthead p { margin: 0; font-size: 13.5px; opacity: .88; }
.masthead .next { font-variant-numeric: tabular-nums; }

.filters { display: grid; gap: 14px; padding-block: 16px 14px; border-bottom: 1px solid var(--line); }
.f-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.f-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.f-value { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }

.hist { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; gap: 2px; height: 64px; margin-top: 8px; }
.bar {
  appearance: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  background: transparent; height: 100%; display: flex; align-items: flex-end; position: relative;
}
.bar i { display: block; width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; transition: opacity .15s; }
.bar.off i { opacity: .22; }
.bar:hover i { filter: brightness(1.08); }
.bar .tip {
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--panel); font-size: 12px; white-space: nowrap;
  padding: 3px 7px; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity .12s;
  font-variant-numeric: tabular-nums; z-index: 2;
}
.bar:hover .tip, .bar:focus-visible .tip { opacity: 1; }

.dual { position: relative; height: 26px; margin-top: 4px; }
.dual input[type=range] {
  position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none;
  -webkit-appearance: none; appearance: none; height: 26px;
}
.dual input[type=range]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
.dual input[type=range]::-moz-range-track { height: 4px; background: transparent; }
.dual input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: auto; width: 22px; height: 22px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--brass); margin-top: -9px; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.dual input[type=range]::-moz-range-thumb {
  pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--brass); cursor: grab;
}
.track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--line); }
.track b { position: absolute; top: 0; bottom: 0; background: var(--brass); border-radius: 2px; }
.ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
}
.chip[aria-pressed="true"] { background: var(--brass-soft); border-color: var(--brass); color: var(--ink); font-weight: 700; }

.search { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }

.list { padding-block: 6px 20px; }
.group-h {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: baseline; gap: 10px;
  background: var(--panel); padding-block: 12px 6px; border-bottom: 1px solid var(--line-2);
}
.group-h .t { font-family: "Young Serif", Georgia, serif; font-size: 19px; font-variant-numeric: tabular-nums; }
.group-h .n { font-size: 13px; color: var(--muted); }
.group-h .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; align-self: center; }
.item {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: start;
  padding-block: 10px; border-bottom: 1px solid var(--line-2); cursor: pointer;
}
.item:hover .i-name { text-decoration: underline; text-underline-offset: 3px; }
.item.sel { background: linear-gradient(90deg, var(--brass-soft), transparent 85%); }
.i-name { font-weight: 700; font-size: 15.5px; background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
.i-meta { grid-column: 1; font-size: 13px; color: var(--muted); }
.i-web { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 13px; color: var(--ink-2); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; white-space: nowrap; }
.i-web:hover { border-color: var(--brass); }
.empty { color: var(--muted); padding-block: 24px; }

.method { font-size: 12.5px; color: var(--muted); padding-block: 16px 24px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.method p { margin: 0; max-width: 62ch; }
.method strong { color: var(--ink-2); }

.mapwrap { position: relative; min-height: 0; height: 100%; }
#map { height: 100%; width: 100%; background: var(--land); }
.leaflet-container { font-family: inherit; background: var(--land); }
.leaflet-control-attribution { font-size: 10.5px; background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--ink-2); }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-bar a:hover { background: var(--bg); }

/* quiz markers: a dot when zoomed out, the start time when zoomed in */
.qm { background: none; border: 0; }
.qm span {
  display: grid; place-items: center; box-sizing: border-box;
  width: 14px; height: 14px; margin: 3px; border-radius: 50%;
  border: 2px solid var(--panel); box-shadow: 0 0 0 1px rgba(0,0,0,.25);
  font-size: 0; font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer;
}
.zoom-near .qm span { width: auto; min-width: 40px; height: 22px; margin: 0; padding: 0 6px; border-radius: 11px; font-size: 12px; }
.qm.sel span { box-shadow: 0 0 0 3px var(--brass); }
.qm.sel { z-index: 1000 !important; }

.lbl { background: none; border: 0; white-space: nowrap; pointer-events: none; }
.lbl span {
  display: inline-block; transform: translate(-50%, -50%); color: var(--label);
  text-shadow: 0 0 2px var(--label-halo), 0 0 2px var(--label-halo), 0 0 3px var(--label-halo);
}
.lbl.place span { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; opacity: .8; }
.lbl.station span { font-size: 11px; transform: translate(6px, -50%); }
.lbl.station span::before {
  content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  border: 1.5px solid var(--label); background: var(--land); margin-right: 4px; vertical-align: 1px;
  margin-left: -11px;
}

.leaflet-popup-content-wrapper { background: var(--panel); color: var(--ink); border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.22); }
.leaflet-popup-tip { background: var(--panel); }
.leaflet-popup-content { margin: 14px 16px; font-size: 14px; line-height: 1.4; min-width: 220px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.pop-time { font-family: "Young Serif", Georgia, serif; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; display: flex; align-items: center; gap: 8px; }
.pop-time .sw { width: 10px; height: 10px; border-radius: 50%; }
.pop h3 { margin: 6px 0 2px; font-size: 16.5px; }
.pop .addr { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.pop blockquote { margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--brass); background: var(--bg); font-size: 13px; color: var(--ink-2); border-radius: 0 6px 6px 0; }
.pop blockquote cite { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.pop .go {
  display: block; text-align: center; text-decoration: none; font-weight: 700;
  background: var(--paint); color: var(--paint-ink) !important; padding: 9px 12px; border-radius: 8px; margin-bottom: 8px;
}
.pop .row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.pop .row a { color: var(--ink-2); }
.pop .meta { margin-top: 8px; font-size: 11.5px; color: var(--muted); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; height: auto; }
  .side { display: contents; }
  .masthead { order: 1; }
  .filters { order: 2; background: var(--panel); }
  .mapwrap { order: 3; height: 62vh; min-height: 360px; position: relative; }
  .side-scroll { order: 4; overflow: visible; background: var(--panel); }
  .masthead h1 { font-size: 24px; }
  .pad { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="side">
    <header class="masthead pad">
      <h1>London Tuesday Quizzes</h1>
      <p><span id="total">0</span> pub quizzes, each confirmed on the pub's own website. <span class="next" id="next"></span></p>
    </header>
    <section class="filters pad" aria-label="Filters">
      <div>
        <div class="f-head"><span class="f-label" id="t-label">Start time</span><output class="f-value" id="range-out" for="t-from t-to"></output></div>
        <div class="hist" id="hist" role="group" aria-label="Quizzes by start time; tap a bar to show only that time"></div>
        <div class="dual">
          <div class="track"><b id="track-fill"></b></div>
          <input type="range" id="t-from" aria-label="Earliest start time">
          <input type="range" id="t-to" aria-label="Latest start time">
        </div>
        <div class="ticks" id="ticks"></div>
      </div>
      <div class="presets" id="presets" role="group" aria-label="Quick start-time ranges"></div>
      <input class="search" id="q" type="search" placeholder="Find a pub, area or postcode" autocomplete="off" aria-label="Find a pub, area or postcode">
    </section>
    <div class="side-scroll">
      <section class="list pad" id="list" aria-live="polite"></section>
      <footer class="method pad" id="method"></footer>
    </div>
  </aside>
  <main class="mapwrap"><div id="map" aria-label="Map of quizzes"></div></main>
</div>

<script type="application/json" id="quiz-data">__QUIZZES__</script>
<script type="application/json" id="base-data">__BASEMAP__</script>
<script type="application/json" id="meta-data">__META__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function () {
  const Q = JSON.parse(document.getElementById('quiz-data').textContent);
  const B = JSON.parse(document.getElementById('base-data').textContent);
  const M = JSON.parse(document.getElementById('meta-data').textContent);

  const mins = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m };
  const fmt = m => { const h = Math.floor(m / 60), mm = m % 60, h12 = ((h + 11) % 12) + 1; return h12 + (mm ? ':' + String(mm).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm') };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  Q.forEach(q => { q.m = mins(q.start) });
  const SLOT = 30;
  const lo = Math.floor(Math.min(...Q.map(q => q.m)) / SLOT) * SLOT;
  const hi = Math.ceil((Math.max(...Q.map(q => q.m)) + 1) / SLOT) * SLOT - SLOT;
  const slots = []; for (let s = lo; s <= hi; s += SLOT) slots.push(s);
  const slotOf = m => Math.floor((m - lo) / SLOT);
  // One hue, light to dark: later quizzes are darker, like the evening.
  const rampVar = i => '--t' + Math.round(slots.length === 1 ? 3 : (i / (slots.length - 1)) * 6);
  const colorFor = m => css(rampVar(slotOf(m)));
  const inkFor = m => (Math.round(slotOf(m) / Math.max(1, slots.length - 1) * 6) <= 1 ? css('--t-ink-light') : css('--t-ink-dark'));

  const state = { from: lo, to: hi, q: '', sel: null };
  try { const s = JSON.parse(localStorage.getItem('ltq-range') || 'null'); if (s && s.from >= lo && s.to <= hi && s.from <= s.to) { state.from = s.from; state.to = s.to } } catch (e) {}

  // ---------- header ----------
  document.getElementById('total').textContent = Q.length;
  const nt = new Date(M.checked + 'T12:00:00Z');
  document.getElementById('next').textContent = 'Checked ' + nt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) + '.';

  // ---------- map ----------
  const map = L.map('map', { preferCanvas: true, zoomSnap: 0.5, minZoom: 10, maxZoom: 17, attributionControl: true })
  map.attributionControl.setPrefix(false).addAttribution('Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');
  const renderer = L.canvas({ padding: 0.5 });
  const pts = Q.map(q => [q.lat, q.lon]);
  map.fitBounds(L.latLngBounds(pts).pad(0.05), { maxZoom: 13 });
  map.setMaxBounds(L.latLngBounds([51.2, -0.7], [51.8, 0.45]));

  const base = {};
  function drawBase() {
    Object.values(base).forEach(l => l && map.removeLayer(l));
    base.parks = L.polygon(B.parks || [], { renderer, stroke: false, fillColor: css('--park'), fillOpacity: 1, interactive: false }).addTo(map);
    base.water = L.polygon(B.water || [], { renderer, stroke: false, fillColor: css('--water'), fillOpacity: 1, interactive: false }).addTo(map);
    base.ww = L.polyline([].concat(...Object.values(B.waterways || {})), { renderer, color: css('--waterline'), weight: 1.5, interactive: false }).addTo(map);
    const R = B.roads || {};
    base.sec = L.polyline(R.secondary || [], { renderer, color: css('--road-minor'), weight: 1, interactive: false }).addTo(map);
    base.pcase = L.polyline([].concat(R.primary || [], R.trunk || [], R.motorway || []), { renderer, color: css('--road-casing'), weight: 3, interactive: false }).addTo(map);
    base.prim = L.polyline([].concat(R.primary || [], R.trunk || [], R.motorway || []), { renderer, color: css('--road-major'), weight: 2, interactive: false }).addTo(map);
    styleRoads();
  }
  function styleRoads() {
    const z = map.getZoom();
    const w = z <= 11 ? 1 : z <= 12 ? 1.6 : z <= 13 ? 2.4 : z <= 14 ? 3.6 : 5;
    base.prim && base.prim.setStyle({ weight: w });
    base.pcase && base.pcase.setStyle({ weight: w + 1.6 });
    base.sec && base.sec.setStyle({ weight: z < 12.5 ? 0 : z <= 13 ? 1 : z <= 14 ? 2 : 3.2, opacity: z < 12.5 ? 0 : 1 });
  }

  const labelPane = map.createPane('labels'); labelPane.style.zIndex = 450; labelPane.style.pointerEvents = 'none';
  const lblPlaces = L.layerGroup((B.places || []).filter(p => p.p === 'suburb' || p.p === 'town').map(p => L.marker([p.lat, p.lon], { pane: 'labels', interactive: false, keyboard: false, icon: L.divIcon({ className: 'lbl place', html: '<span>' + esc(p.n) + '</span>', iconSize: null }) })));
  const lblHoods = L.layerGroup((B.places || []).filter(p => p.p === 'neighbourhood' || p.p === 'quarter').map(p => L.marker([p.lat, p.lon], { pane: 'labels', interactive: false, keyboard: false, icon: L.divIcon({ className: 'lbl place', html: '<span>' + esc(p.n) + '</span>', iconSize: null }) })));
  const lblStations = L.layerGroup((B.stations || []).map(s => L.marker([s.lat, s.lon], { pane: 'labels', interactive: false, keyboard: false, icon: L.divIcon({ className: 'lbl station', html: '<span>' + esc(s.n) + '</span>', iconSize: null }) })));
  function labels() {
    const z = map.getZoom();
    const want = [[lblPlaces, z >= 11.5 && z < 14.5], [lblHoods, z >= 14.5], [lblStations, z >= 14]];
    want.forEach(([g, on]) => on ? (map.hasLayer(g) || g.addTo(map)) : (map.hasLayer(g) && map.removeLayer(g)));
    map.getContainer().classList.toggle('zoom-near', z >= 13);
    styleRoads();
  }
  map.on('zoomend', labels);

  // ---------- quizzes ----------
  const markers = new Map();
  const gmaps = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q.name + ', ' + (q.postcode || q.address || 'London'));
  function popupHtml(q) {
    const checked = new Date(q.checked + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
    const kind = { pub: "the pub's own website", company: "the pub company's page for this pub", host: "the quiz host's own venue list" }[q.source_kind] || 'its website';
    return '<div class="pop">' +
      '<div class="pop-time"><span class="sw" style="background:' + colorFor(q.m) + '"></span>' + fmt(q.m) + '</div>' +
      '<h3>' + esc(q.name) + '</h3>' +
      '<p class="addr">' + esc(q.address) + '</p>' +
      '<blockquote>“' + esc(q.quote) + '”<cite>' + esc(kind) + (q.freq_note ? ' · ' + esc(q.freq_note) : '') + '</cite></blockquote>' +
      '<a class="go" href="' + esc(q.source_url) + '" target="_blank" rel="noopener">Check it on the website ↗</a>' +
      '<div class="row">' + (q.website && q.website !== q.source_url ? '<a href="' + esc(q.website) + '" target="_blank" rel="noopener">Pub homepage ↗</a>' : '') +
      '<a href="' + gmaps(q) + '" target="_blank" rel="noopener">Directions ↗</a></div>' +
      '<div class="meta">Read on ' + checked + (q.host ? ' · Quiz by ' + esc(q.host) : '') + '</div>' +
      '</div>';
  }
  Q.forEach(q => {
    const icon = L.divIcon({ className: 'qm', iconSize: null, html: '<span style="background:' + colorFor(q.m) + ';color:' + inkFor(q.m) + '">' + fmt(q.m).replace(/(am|pm)$/, '') + '</span>' });
    const mk = L.marker([q.lat, q.lon], { icon, title: q.name + ', ' + fmt(q.m), riseOnHover: true, keyboard: true, alt: q.name });
    mk.bindPopup(() => popupHtml(q), { maxWidth: 300, autoPanPaddingTopLeft: [20, 20] });
    mk.on('popupopen', () => select(q.id, false));
    mk.on('popupclose', () => { if (state.sel === q.id) select(null, false) });
    markers.set(q.id, mk);
  });
  function recolour() {
    Q.forEach(q => { const el = markers.get(q.id).getElement(); if (el) { const s = el.querySelector('span'); s.style.background = colorFor(q.m); s.style.color = inkFor(q.m) } });
  }

  // ---------- filters ----------
  const $from = document.getElementById('t-from'), $to = document.getElementById('t-to');
  [$from, $to].forEach(i => { i.min = lo; i.max = hi; i.step = SLOT });
  $from.value = state.from; $to.value = state.to;
  const ticks = document.getElementById('ticks');
  ticks.innerHTML = [lo, hi].map(m => '<span>' + fmt(m) + '</span>').join('');
  if (slots.length > 3) ticks.innerHTML = '<span>' + fmt(lo) + '</span><span>' + fmt(slots[Math.floor(slots.length / 2)]) + '</span><span>' + fmt(hi) + '</span>';

  const counts = slots.map(s => Q.filter(q => q.m >= s && q.m < s + SLOT).length);
  const maxC = Math.max(...counts);
  const hist = document.getElementById('hist');
  hist.innerHTML = slots.map((s, i) => '<button class="bar" type="button" data-s="' + s + '" aria-label="' + fmt(s) + (SLOT === 30 ? ' to ' + fmt(s + 29) : '') + ': ' + counts[i] + ' quizzes"><i style="height:' + Math.max(3, counts[i] / maxC * 100) + '%;background:var(' + rampVar(i) + ')"></i><span class="tip">' + fmt(s) + ' · ' + counts[i] + '</span></button>').join('');
  hist.addEventListener('click', e => {
    const b = e.target.closest('.bar'); if (!b) return;
    const s = +b.dataset.s;
    if (state.from === s && state.to === s) { state.from = lo; state.to = hi } else { state.from = s; state.to = s }
    apply();
  });

  const presetDefs = [
    { label: 'Any time', from: lo, to: hi },
    { label: 'Before 7:30pm', from: lo, to: Math.min(hi, 19 * 60) },
    { label: '7:30–8pm', from: Math.max(lo, 19 * 60 + 30), to: Math.min(hi, 20 * 60) },
    { label: '8:30pm or later', from: Math.max(lo, 20 * 60 + 30), to: hi },
  ].filter(p => p.from <= p.to);
  const presets = document.getElementById('presets');
  presets.innerHTML = presetDefs.map((p, i) => '<button class="chip" type="button" data-i="' + i + '" aria-pressed="false">' + p.label + '</button>').join('');
  presets.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; const p = presetDefs[+b.dataset.i]; state.from = p.from; state.to = p.to; apply() });

  $from.addEventListener('input', () => { state.from = Math.min(+$from.value, state.to); apply() });
  $to.addEventListener('input', () => { state.to = Math.max(+$to.value, state.from); apply() });
  document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); apply() });

  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ');
  function visible(q) {
    if (q.m < state.from || q.m >= state.to + SLOT) return false;
    if (state.q) { const hay = norm([q.name, q.area, q.address, q.postcode, q.host].join(' ')); if (!norm(state.q).split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false }
    return true;
  }

  const list = document.getElementById('list');
  function apply() {
    $from.value = state.from; $to.value = state.to;
    const span = hi - lo || 1;
    const f = document.getElementById('track-fill');
    f.style.left = ((state.from - lo) / span * 100) + '%';
    f.style.right = ((hi - state.to) / span * 100) + '%';
    const all = state.from === lo && state.to === hi;
    document.getElementById('range-out').textContent = all ? 'Any time' : state.from === state.to ? fmt(state.from) + (SLOT === 30 ? '–' + fmt(state.from + 29) : '') : fmt(state.from) + ' – ' + fmt(state.to + SLOT - 1);
    hist.querySelectorAll('.bar').forEach(b => b.classList.toggle('off', +b.dataset.s < state.from || +b.dataset.s > state.to));
    presets.querySelectorAll('.chip').forEach(b => { const p = presetDefs[+b.dataset.i]; b.setAttribute('aria-pressed', String(p.from === state.from && p.to === state.to)) });
    try { localStorage.setItem('ltq-range', JSON.stringify({ from: state.from, to: state.to })) } catch (e) {}

    const vis = Q.filter(visible).sort((a, b) => a.m - b.m || a.name.localeCompare(b.name));
    const visIds = new Set(vis.map(q => q.id));
    markers.forEach((mk, id) => { const on = visIds.has(id); if (on && !map.hasLayer(mk)) mk.addTo(map); if (!on && map.hasLayer(mk)) map.removeLayer(mk) });
    recolour();

    if (!vis.length) { list.innerHTML = '<p class="empty">No quizzes start in that window. Widen the time range or clear the search.</p>'; return }
    let html = '', cur = null;
    for (const q of vis) {
      if (q.m !== cur) {
        cur = q.m;
        const n = vis.filter(x => x.m === cur).length;
        html += '<h2 class="group-h"><span class="sw" style="background:' + colorFor(cur) + '"></span><span class="t">' + fmt(cur) + '</span><span class="n">' + n + (n === 1 ? ' quiz' : ' quizzes') + '</span></h2>';
      }
      html += '<div class="item' + (state.sel === q.id ? ' sel' : '') + '" data-id="' + esc(q.id) + '">' +
        '<button class="i-name" type="button">' + esc(q.name) + '</button>' +
        '<a class="i-web" href="' + esc(q.source_url) + '" target="_blank" rel="noopener" aria-label="' + esc(q.name) + ' website">Website ↗</a>' +
        '<div class="i-meta">' + esc(q.area) + (q.postcode ? ' · ' + esc(q.postcode) : '') + '</div></div>';
    }
    list.innerHTML = html;
  }
  list.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const it = e.target.closest('.item'); if (!it) return;
    const mk = markers.get(it.dataset.id);
    if (window.matchMedia('(max-width: 820px)').matches) document.querySelector('.mapwrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    map.flyTo(mk.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.6 });
    map.once('moveend', () => mk.openPopup());
  });
  function select(id, pan) {
    state.sel = id;
    markers.forEach((mk, k) => { const el = mk.getElement(); if (el) el.classList.toggle('sel', k === id) });
    list.querySelectorAll('.item').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
    if (id) { const el = list.querySelector('.item[data-id="' + CSS.escape(id) + '"]'); if (el && !window.matchMedia('(max-width: 820px)').matches) el.scrollIntoView({ block: 'nearest' }) }
  }

  // ---------- method note ----------
  document.getElementById('method').innerHTML =
    '<p><strong>How a pub gets on this map.</strong> Its own website, the pub company\'s page for it, or the quiz host\'s own venue list has to say there is a quiz every Tuesday and give the start time. The words are quoted on each pub. Listings sites and old articles were used to find pubs, never to confirm them.</p>' +
    (M.unconfirmed ? '<p>' + M.unconfirmed + ' more Tuesday quizzes turned up on listings sites but could not be confirmed on a first-hand page, so they are left off.</p>' : '') +
    '<p>Quizzes get cancelled and moved. Tap through to the pub before you go.</p>' +
    '<p>Map drawn from OpenStreetMap data. Positions come from the pub\'s entry in OpenStreetMap where it matched, otherwise its postcode.</p>';

  // ---------- theme ----------
  function retheme() { drawBase(); recolour(); hist.querySelectorAll('.bar i').forEach((b, i) => b.style.background = 'var(' + rampVar(i) + ')'); apply() }
  drawBase(); labels(); apply();
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme) } catch (e) {}
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
